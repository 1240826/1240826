    <clipPath id="c2"><rect id="r2" class="reveal" x="30" y="86" height="40"/></clipPath>
    <clipPath id="c3"><rect id="r3" class="reveal" x="30" y="150" height="26"/></clipPath>
    <clipPath id="c4"><rect id="r4" class="reveal" x="30" y="184" height="26"/></clipPath>
  </defs>

  <rect width="860" height="270" rx="12" fill="var(--bg)"/>
  <path d="M0 12a12 12 0 0 1 12-12h836a12 12 0 0 1 12 12v22H0z" fill="var(--bar)"/>
  <circle cx="24" cy="17" r="6" fill="#f38ba8"/><circle cx="46" cy="17" r="6" fill="#f9e2af"/><circle cx="68" cy="17" r="6" fill="#a6e3a1"/>
  <text x="430" y="22" text-anchor="middle" class="dim" style="font-size:13px">fabio@costa: ~</text>

  <!-- line 1: command -->
  <g clip-path="url(#c1)"><text x="30" y="70"><tspan class="g">fabio@costa</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="dim">$ </tspan>whoami</text></g>
  <!-- output 1 -->
  <g class="out1 hide2"><text x="30" y="108" class="name">Fábio Costa</text></g>
  <g clip-path="url(#c2)"><text x="30" y="122" class="dim" style="font-size:16px">informatics engineering · ISEP · Porto</text></g>

  <!-- line 3 -->
  <g clip-path="url(#c3)"><text x="30" y="168"><tspan class="g">fabio@costa</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="dim">$ </tspan>ls interests/</text></g>
  <!-- output 3 -->
  <g clip-path="url(#c4)"><text x="30" y="202"><tspan class="m">backend/</tspan>  <tspan class="m">systems/</tspan>  <tspan class="m">security/</tspan>  <tspan class="m">ai/</tspan>  <tspan class="p">football/</tspan></text></g>

  <!-- prompt + cursor -->
  <g class="hide4" style="animation-delay:5s"><text x="30" y="240"><tspan class="g">fabio@costa</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="dim">$ </tspan><tspan class="cursor">█</tspan></text></g>
