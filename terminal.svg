<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270" role="img" aria-label="Terminal: whoami. Fábio Costa, Informatics Engineering student at ISEP. Interests: backend, systems, security, AI, football.">
  <title>fabio@costa: ~</title>
  <style>
    :root { --bg:#1e1e2e; --bar:#181825; --fg:#cdd6f4; --dim:#6c7086; --green:#a6e3a1; --blue:#89b4fa; --mauve:#cba6f7; --peach:#fab387; --line:#313244; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#eff1f5; --bar:#e6e9ef; --fg:#4c4f69; --dim:#8c8fa1; --green:#40a02b; --blue:#1e66f5; --mauve:#8839ef; --peach:#fe640b; --line:#ccd0da; }
    }
    text { font-family: 'JetBrains Mono','Cascadia Code','Consolas','DejaVu Sans Mono',monospace; font-size:17px; fill:var(--fg); white-space:pre; }
    .dim{fill:var(--dim)} .g{fill:var(--green)} .b{fill:var(--blue)} .m{fill:var(--mauve)} .p{fill:var(--peach)}
    .name{font-size:30px;font-weight:700}
    .reveal{width:0}
    @keyframes type { to { width:760px } }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    #r1{animation:type .7s steps(8) .4s forwards}
    #r2{animation:type .9s steps(34) 1.3s forwards}
    #r3{animation:type 1s steps(18) 2.5s forwards}
    #r4{animation:type 1.3s steps(40) 3.7s forwards}
    .hide2{opacity:0;animation:show 0s 1.3s forwards}
    .hide3{opacity:0;animation:show 0s 2.5s forwards}
    .hide4{opacity:0;animation:show 0s 3.7s forwards}
    .out1{opacity:0;animation:show 0s 1.2s forwards}
    @keyframes show { to { opacity:1 } }
    .cursor{animation:blink 1s steps(1) infinite}
    @media (prefers-reduced-motion: reduce) {
      .reveal{width:760px!important;animation:none!important}
      .hide2,.hide3,.hide4,.out1{opacity:1!important;animation:none!important}
    }
  </style>
  <defs>
